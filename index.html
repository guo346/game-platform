<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏平台</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { margin: 0; padding: 20px; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; min-height: 100vh; justify-content: center; }
        .container { text-align: center; max-width: 600px; width: 100%; }
        h1 { color: #333; margin-bottom: 40px; font-size: 36px; }
        .game-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 30px; }
        .game-card { background: white; padding: 40px 20px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); transition: all 0.3s; cursor: pointer; text-decoration: none; color: #333; }
        .game-card:hover { transform: translateY(-5px); box-shadow: 0 8px 30px rgba(0,0,0,0.15); }
        .game-card h2 { margin: 0 0 15px 0; color: #4e73df; font-size: 24px; }
        .game-card p { margin: 0; color: #666; font-size: 16px; }
        .game-card.schulte { border-left: 5px solid #4e73df; }
        .game-card.gobang { border-left: 5px solid #1cc88a; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 游戏平台</h1>
        <div class="game-cards">
            <a href="schulte.html" class="game-card schulte">
                <h2>舒尔特方格</h2>
                <p>专注力训练游戏</p>
            </a>
            <a href="gobang.html" class="game-card gobang">
                <h2>AI五子棋大战</h2>
                <p>与AI智能体对战五子棋</p>
            </a>
        </div>
    </div>
</body>
</html>
